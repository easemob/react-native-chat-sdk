name: Setup
description: Setup Node.js and install dependencies

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc

    - name: Setup Yarn from checked-in release
      # Corepack ignores `yarnPath` in .yarnrc.yml and always downloads
      # yarn@<packageManager> from repo.yarnpkg.com on fresh runners. That
      # download is a spurious network dependency and has failed CI with
      # connect timeouts. The repo already commits the Yarn release, so put a
      # shim for it on PATH instead of using corepack. GITHUB_PATH prepends,
      # so this wins over the runner image's preinstalled Yarn 1.x.
      run: |
        yarn_path=$(sed -n 's/^yarnPath:[[:space:]]*//p' .yarnrc.yml)
        test -f "$yarn_path" || { echo "yarnPath not found: $yarn_path"; exit 1; }
        shim_dir="$RUNNER_TEMP/yarn-shim"
        mkdir -p "$shim_dir"
        printf '#!/usr/bin/env bash\nexec node "%s/%s" "$@"\n' "$GITHUB_WORKSPACE" "$yarn_path" > "$shim_dir/yarn"
        chmod +x "$shim_dir/yarn"
        echo "$shim_dir" >> "$GITHUB_PATH"
      shell: bash

    - name: Restore dependencies
      id: yarn-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          **/node_modules
          .yarn/install-state.gz
        # Job name at the end keeps the save key unique per job (concurrent jobs on
        # the same OS otherwise race to save the identical key and one fails with
        # "Unable to reserve cache"), while restore-keys prefix matching still lets
        # jobs reuse each other's cache.
        key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}-${{ hashFiles('**/package.json', '!node_modules/**') }}-${{ github.job }}
        restore-keys: |
          ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          ${{ runner.os }}-yarn-

    - name: Install dependencies
      if: steps.yarn-cache.outputs.cache-hit != 'true'
      run: yarn install --immutable
      shell: bash

    - name: Cache dependencies
      if: steps.yarn-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          **/node_modules
          .yarn/install-state.gz
        key: ${{ steps.yarn-cache.outputs.cache-primary-key }}
