name: Device Smoke

on:
  schedule:
    - cron: '43 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rn-device-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    name: Android smoke build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node.js and dependencies
        uses: ./.github/actions/setup

      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Generate build files
        run: yarn gen:version_file && yarn gen:cmake_file && yarn gen:env_file

      - name: Build Android smoke APK
        working-directory: example/android
        env:
          # Inlined into the JS bundle by example/babel-plugin-inline-api-env.js;
          # must match DEVICE_SCRIPT_PATH in scripts/ci/run_smoke_android.sh.
          API_SCRIPT: /data/local/tmp/rn_smoke_no_login.json
        # x86_64 for the CI emulator (the base CI builds arm64-v8a).
        # -PbundleInDebug=true embeds the JS bundle; debug builds normally load
        # JS from Metro, which a headless emulator cannot reach.
        run: ./gradlew app:assembleDebug --no-daemon --console=plain -PreactNativeArchitectures=x86_64 -PbundleInDebug=true

      - name: Upload smoke APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rn-smoke-android-apk-${{ github.run_id }}
          path: example/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1

  android-test:
    name: Android smoke test
    needs: android-build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Download smoke APK
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: rn-smoke-android-apk-${{ github.run_id }}
          path: artifacts

      - name: Run smoke on Android emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          # The logcat dump must happen inside the emulator session; the
          # emulator is gone once this step ends.
          script: |
            APK_PATH=artifacts/app-debug.apk bash scripts/ci/run_smoke_android.sh || {
              mkdir -p build/reports
              adb logcat -d > build/reports/smoke-android-logcat.log || true
              exit 1
            }

      - name: Upload Android smoke logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rn-device-smoke-android-${{ github.run_id }}
          path: |
            build/reports/smoke-android-api_test.log
            build/reports/smoke-android-logcat.log
          if-no-files-found: warn
          retention-days: 7

  ios-build:
    name: iOS smoke build
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      RCT_USE_RN_DEP: 1
      RCT_USE_PREBUILT_RNCORE: 1
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node.js and dependencies
        uses: ./.github/actions/setup

      - name: Cache bundler
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: example/vendor/bundle
          key: ${{ runner.os }}-bundler-${{ hashFiles('example/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-bundler-

      - name: Install CocoaPods via bundler
        working-directory: example
        run: |
          bundle config set --local path vendor/bundle
          bundle install

      - name: Cache Pods
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            example/ios/Pods
            ~/.cocoapods
          key: ${{ runner.os }}-pods-${{ hashFiles('example/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Generate build files
        run: yarn gen:version_file && yarn gen:cmake_file && yarn gen:env_file

      - name: Install pods
        working-directory: example
        run: bundle exec pod install --project-directory=ios

      - name: Build iOS smoke app
        working-directory: example
        # API_SCRIPT is passed as a user-defined build setting so the RN bundle
        # phase sees it (script phases only inherit build settings, not process
        # env). FORCE_BUNDLING=1 makes the Debug build embed the JS bundle;
        # Debug simulator builds normally skip bundling and load from Metro.
        # The simulator shares the host file system, so the value must match
        # HOST_SCRIPT_PATH in scripts/ci/run_smoke_ios.sh. Do NOT pass
        # CODE_SIGNING_ALLOWED=NO: the embedded HyphenateChat.framework must be
        # ad-hoc signed or dyld refuses to load it on Apple Silicon simulators.
        run: |
          xcodebuild -workspace ios/ChatSdkExample.xcworkspace \
            -scheme ChatSdkExample \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath ios/build \
            FORCE_BUNDLING=1 \
            API_SCRIPT=/tmp/rn_smoke_no_login.json \
            build

      - name: Upload smoke app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rn-smoke-ios-app-${{ github.run_id }}
          path: example/ios/build/Build/Products/Debug-iphonesimulator/ChatSdkExample.app
          retention-days: 1

  ios-test:
    name: iOS smoke test
    needs: ios-build
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Download smoke app
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: rn-smoke-ios-app-${{ github.run_id }}
          path: artifacts

      - name: Run smoke on iOS simulator
        run: |
          # Artifact download may drop the executable bit on the app binary.
          chmod +x artifacts/ChatSdkExample.app/ChatSdkExample || true
          simulator_udid="$(bash scripts/ci/boot_ios_simulator.sh)"
          echo "Using iOS simulator $simulator_udid"
          DEVICE_UDID="$simulator_udid" APP_PATH=artifacts/ChatSdkExample.app \
            bash scripts/ci/run_smoke_ios.sh

      - name: Collect iOS diagnostics after failure
        if: failure()
        run: |
          mkdir -p build/reports
          xcrun simctl diagnose --output build/reports/ios-sim-diagnose.tar.gz || true

      - name: Upload iOS smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rn-device-smoke-ios-${{ github.run_id }}
          path: |
            build/reports/smoke-ios-api_test.log
            build/reports/ios-sim-diagnose.tar.gz
          if-no-files-found: warn
          retention-days: 7
