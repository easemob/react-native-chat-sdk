name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rn-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node.js and dependencies
        uses: ./.github/actions/setup

      - name: Run quality gates
        run: bash scripts/ci/run_quality.sh

      - name: Upload unit test coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rn-unit-coverage-${{ github.run_id }}
          path: coverage/lcov.info
          if-no-files-found: warn
          retention-days: 7

  android-build:
    name: Android debug build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node.js and dependencies
        uses: ./.github/actions/setup

      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Generate build files
        run: yarn gen:version_file && yarn gen:cmake_file && yarn gen:env_file

      - name: Build Android example
        run: |
          mkdir -p build/reports
          # tee captures the full build output as the raw log for the deprecation
          # scan below. GH Actions runs bash with pipefail, so tee does not mask
          # a build failure.
          yarn example build:android 2>&1 | tee build/reports/deprecated-android-raw.log

      - name: Scan deprecated Android APIs
        if: always()
        # Parse-only: reuses the raw log captured during the build above instead of
        # a second clean build. This relies on CI runners being fresh machines (full
        # compile emits all warnings). If compile-artifact caching is ever added to
        # this job, builds become incremental and stop re-emitting warnings — split
        # the scan back into its own clean-build step (scripts/scan-deprecated-android.sh).
        # The redirect target dir is normally created by the build step above; create
        # it here too so this always() step fails with the script's own message
        # (missing raw log) instead of a shell redirect error when the build step
        # was skipped or died before its mkdir.
        run: |
          mkdir -p build/reports
          bash scripts/parse-deprecated-android.sh > build/reports/deprecated-android.json

      - name: Upload deprecated API report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-deprecated-api-${{ github.run_id }}
          path: |
            build/reports/deprecated-android.json
            build/reports/deprecated-android-warnings.log
          if-no-files-found: warn
          retention-days: 7

  ios-build:
    name: iOS build
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      RCT_USE_RN_DEP: 1
      RCT_USE_PREBUILT_RNCORE: 1
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node.js and dependencies
        uses: ./.github/actions/setup

      - name: Cache bundler
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: example/vendor/bundle
          key: ${{ runner.os }}-bundler-${{ hashFiles('example/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-bundler-

      - name: Install CocoaPods via bundler
        working-directory: example
        run: |
          bundle config set --local path vendor/bundle
          bundle install

      - name: Cache Pods
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            example/ios/Pods
            ~/.cocoapods
          key: ${{ runner.os }}-pods-${{ hashFiles('example/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Generate build files
        run: yarn gen:version_file && yarn gen:cmake_file && yarn gen:env_file

      - name: Install pods
        working-directory: example
        run: bundle exec pod install --project-directory=ios

      - name: Build iOS example
        run: |
          mkdir -p build/reports
          # tee captures the full build output as the raw log for the deprecation
          # scan below. GH Actions runs bash with pipefail, so tee does not mask
          # a build failure.
          yarn example build:ios 2>&1 | tee build/reports/deprecated-ios-raw.log

      - name: Scan deprecated iOS APIs
        if: always()
        # Parse-only: reuses the raw log captured during the build above instead of
        # a second clean build. This relies on CI runners being fresh machines (full
        # compile emits all warnings). If compile-artifact caching is ever added to
        # this job, builds become incremental and stop re-emitting warnings — split
        # the scan back into its own clean-build step (scripts/scan-deprecated-ios.sh).
        # The redirect target dir is normally created by the build step above; create
        # it here too so this always() step fails with the script's own message
        # (missing raw log) instead of a shell redirect error when the build step
        # was skipped or died before its mkdir.
        run: |
          mkdir -p build/reports
          bash scripts/parse-deprecated-ios.sh > build/reports/deprecated-ios.json

      - name: Upload deprecated API report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-deprecated-api-${{ github.run_id }}
          path: |
            build/reports/deprecated-ios.json
            build/reports/deprecated-ios-warnings.log
          if-no-files-found: warn
          retention-days: 7
